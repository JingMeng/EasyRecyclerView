apply plugin: 'com.android.library'

android {
    namespace 'com.jude.easyrecyclerview'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    compileSdk 34

    defaultConfig {
        minSdk 14
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    
    }
}

dependencies {
    compileOnly 'androidx.recyclerview:recyclerview:1.1.0'
    compileOnly 'androidx.swiperefreshlayout:swiperefreshlayout:1.0.0'
}
ext {
    bintrayRepo = 'maven'
    bintrayName = 'easyrecyclerview'

    publishedGroupId = 'com.jude'
    artifact = 'easyrecyclerview'

    siteUrl = 'https://github.com/Jude95/EasyRecyclerView'
    gitUrl = 'https://github.com/Jude95/EasyRecyclerView'

    libraryVersion = '4.4.2'
    libraryName = 'easyrecyclerview'
    libraryDescription = 'A tool for Android'

    developerId = 'jude95'
    developerName = 'jude95'
    developerEmail = 'jude@helloworld.moe'


    licenseName = 'The Apache Software License, Version 2.0'
    licenseUrl = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
    allLicenses = ["Apache-2.0"]
}

