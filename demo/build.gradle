apply plugin: 'com.android.application'

android {
    namespace 'com.jude.dome'
    compileSdk 34

    defaultConfig {
        applicationId "com.jude.dome"
        minSdk 15
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'com.github.bumptech.glide:glide:3.6.1'
    implementation 'jp.wasabeef:glide-transformations:1.3.1'
    implementation 'com.jude:rollviewpager:1.2.9'
    implementation project(':easyrecyclerview')
    implementation 'com.github.clans:fab:1.6.0'

}




